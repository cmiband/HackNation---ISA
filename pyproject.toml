[project]
name = "udip-assistant"
version = "0.1.0"
description = "Assistant for officials handling requests for access to public information (UDIP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-ai-slim[openai,anthropic,google]>=2.71",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "sqlmodel>=0.0.22",
    "streamlit>=1.40.0",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_service", "app", "contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".local"]

[tool.ruff.lint]
# Ruff defaults (pyflakes + core pycodestyle errors) + import sorting, bugbear, pyupgrade
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
